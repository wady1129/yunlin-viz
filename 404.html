<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>Yunlin Instance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <!-- 換掉整段 aside；class 多加 drawer，並加上 id="sidebar" -->
    <aside id="sidebar" class="sidebar drawer">
      <div class="topbar">
        <h1 data-i18n="title"></h1>
        <select id="langSel" class="langsel" aria-label="Language">
          <option value="zh-Hant">繁中</option>
          <option value="en">English</option>
        </select>
        <button id="drawerToggleInside" class="icon-btn" aria-label="Collapse panel" title="收合面板"></button>
      </div>

      <div class="collapsible">
        <div class="muted" data-i18n="hint"></div>

        <div class="group">
          <label data-i18n="instance"></label>
          <select id="instanceSel"><option value=""></option></select>
          <div id="instMeta" class="muted" style="margin-top:6px;"></div>
        </div>

        <div class="group">
          <div class="row">
            <div>
              <label data-i18n="nodeA"></label>
              <select id="originSel"></select>
            </div>
            <div>
              <label data-i18n="nodeB"></label>
              <select id="destSel"></select>
            </div>
            <div>
              <button id="showBtn" disabled data-i18n="show"></button>
            </div>
          </div>
          <div id="routeInfo" class="pill" style="display:none;"></div>
        </div>

        <div class="legend">
          <span><span class="dot green"></span><span data-i18n="legendOrigin"></span></span>
          <span><span class="dot orange"></span><span data-i18n="legendDest"></span></span>
        </div>

        <div class="group">
          <label data-i18n="allPairs"></label>
          <button id="showMatrixBtn" class="secondary" data-i18n="openMatrix"></button>
        </div>

        <div class="group">
          <label data-i18n="status"></label>
          <div id="log" class="log">初始化中…</div>
        </div>
      </div>
    </aside>
    <button id="edgeOpen" class="edge-open" aria-label="Open panel" title="展開面板"></button>




    <main class="mapwrap">
      <div id="map"></div>
    </main>
  </div>

  <!-- ===== 矩陣全螢幕面板 ===== -->
  <div id="matrixModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-body" role="dialog" aria-modal="true" aria-labelledby="matrixTitle">
      <div class="modal-header">
        <div class="title">
          <strong id="matrixTitle" data-i18n="matrixTitle"></strong>
          <span id="matrixSubtitle" class="muted"></span>
        </div>
        <div class="tools">
          <button id="btnFit"   title="" data-i18n="fit"></button>
          <button id="btnZoomOut" title="" data-i18n="zoomOut"></button>
          <button id="btnZoomIn"  title="" data-i18n="zoomIn"></button>
          <button id="btnClose" class="danger" title="" data-i18n="close"></button>
        </div>
      </div>
      <div class="modal-content">
        <div id="matrixViewport" class="matrixViewport">
          <!-- 這裡放矩陣表格 -->
        </div>
        <div class="legendbar">
          <span class="muted">分鐘</span>
          <div class="legendbar-grad"></div>
          <span class="muted">↑ 越深表示越久</span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
</body>
</html>
